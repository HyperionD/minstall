name: Release Android APK

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        type: string

permissions:
  contents: write

env:
  ANDROID_PLATFORM: 'android-36'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK: '27.1.12297006'

jobs:
  release-android:
    name: Build and release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release tag: $tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}"
          ndk_path="$ANDROID_HOME/ndk/$ANDROID_NDK"
          test -x "$ndk_path/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          {
            echo "NDK_HOME=$ndk_path"
            echo "ANDROID_NDK_HOME=$ndk_path"
            echo "ANDROID_NDK_ROOT=$ndk_path"
          } >> "$GITHUB_ENV"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MINSTALL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINSTALL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MINSTALL_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/release.keystore
          chmod 600 src-tauri/gen/android/release.keystore
          {
            printf 'MINSTALL_STORE_FILE=%s\n' "$GITHUB_WORKSPACE/src-tauri/gen/android/release.keystore"
            printf 'MINSTALL_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'MINSTALL_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'MINSTALL_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
          chmod 600 src-tauri/gen/android/keystore.properties

      - name: Build signed Android APK
        run: npm run tauri -- android build --apk --target aarch64 --ci

      - name: Verify and checksum APK
        id: apk
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          apk_source=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$apk_source"
          apk_name="minstall-${RELEASE_TAG#v}-android-arm64-v8a.apk"
          cp "$apk_source" "$apk_name"
          apksigner verify --verbose "$apk_name"
          sha256sum "$apk_name" > SHA256SUMS
          echo "path=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          gh release create "$RELEASE_TAG" "$APK_PATH" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "minstall ${RELEASE_TAG} (Experimental)" \
            --prerelease \
            --generate-notes
