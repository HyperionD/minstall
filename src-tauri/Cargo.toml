[package]
name = "minstall"
version = "0.1.0"
description = "小米手环 10 Pro 表盘直装工具"
authors = ["minstall contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "minstall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 协议走经典蓝牙 SPP（RFCOMM ch5），见 docs/protocol-notes.md 4.3/4.5 节
bluer = { version = "0.17", features = ["bluetoothd", "rfcomm"] }
futures = "0.3"
# 认证/加密原语（协议笔记 4.4/4.5 节：AES-128-CTR/CCM + HMAC-SHA256）
aes = "0.8"
ctr = "0.9"
ccm = "0.5"
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util"] }
thiserror = "2"

