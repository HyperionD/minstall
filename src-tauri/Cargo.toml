[package]
name = "minstall"
version = "0.2.0"
description = "小米手环 10 Pro 表盘直装工具（蓝牙直连，不经过官方 App）"
authors = ["minstall contributors"]
edition = "2021"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/HyperionD/minstall"
homepage = "https://github.com/HyperionD/minstall"
# 默认运行 GUI 主程序（src/main.rs）；诊断工具用 --bin 显式指定
default-run = "minstall"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "minstall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 认证/加密原语（协议笔记 4.4/4.5 节：AES-128-CTR/CCM + HMAC-SHA256）
aes = "0.8"
ctr = "0.9"
ccm = "0.5"
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util"] }
thiserror = "2"
zip = { version = "6", default-features = false, features = ["deflate"] }

# Linux：经典蓝牙 SPP（RFCOMM ch5）走 BlueZ（bluer），见 docs/protocol-notes.md 4.3/4.5 节。
# Android：蓝牙层在 Kotlin（JNI 桥），Rust 侧不依赖 BlueZ。
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd", "rfcomm"] }
futures = "0.3"
keyring-core = "1.0.0"
# 文件选择对话框：仅桌面端（Android 用原生 SAF，经 Tauri command 暴露）
tauri-plugin-dialog = "2.7"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

# Android：JNI 调 Kotlin RFCOMM + libc 读写 fd
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"

